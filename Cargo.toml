[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/agent",
  "crates/runner",
  "crates/elevated-helper",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
