name: awesome-workflow

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - aw-network

services:
  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: awesome_workflow
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d awesome_workflow']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Current MinIO releases do not implement bucket-level PutBucketCors.
      # Keep browser upload origins explicit at the server boundary instead.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:4300,http://localhost:4302}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    networks:
      - aw-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-awesome-workflow-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set aw "$${MINIO_INTERNAL_ENDPOINT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "aw/$${ARTIFACT_BUCKET}"
        mc anonymous set none "aw/$${ARTIFACT_BUCKET}"

  mailpit:
    <<: *service-defaults
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  logto:
    <<: *service-defaults
    image: ${LOGTO_IMAGE:-svhd/logto:1.31.0}
    # The image declares ENTRYPOINT ["npm", "run"]. Override the entrypoint,
    # not CMD, or Compose would execute `npm run sh ...`.
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logto
      ENDPOINT: ${LOGTO_PUBLIC_ENDPOINT:-http://logto.localhost:3001}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-http://localhost:3002}
      TRUST_PROXY_HEADER: '1'
    ports:
      - '${LOGTO_PORT:-3001}:3001'
      - '${LOGTO_ADMIN_PORT:-3002}:3002'
    networks:
      aw-network:
        aliases:
          # Keep the browser-visible issuer host while routing API discovery
          # directly to this container instead of hairpinning via the host.
          - logto.localhost
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/oidc/.well-known/openid-configuration').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: 'no'
    networks:
      - aw-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/awesome_workflow
    command: ['node', 'apps/api/dist/db/migrate.js']

  api:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      logto:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 4100
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4100}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:4300}
      API_ORIGINS: ${API_ORIGINS:-http://localhost:4300,http://localhost:4302,tauri://localhost,http://tauri.localhost}
      REPOSITORY_MODE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/awesome_workflow
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      OTP_PEPPER: ${OTP_PEPPER}
      AUTH_MODE: ${AUTH_MODE:-hybrid}
      AUTH_DEV_EXPOSE_OTP: ${AUTH_DEV_EXPOSE_OTP:-false}
      AUTH_PASSWORD_ADMIN_EMAIL: ${AUTH_PASSWORD_ADMIN_EMAIL:-}
      AUTH_PASSWORD_ADMIN_PASSWORD: ${AUTH_PASSWORD_ADMIN_PASSWORD:-}
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-smtp}
      # The .env value is host-facing; containers reach the local SMTP fixture
      # by its Compose service name.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_REQUIRE_TLS: 'false'
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@awesome-workflow.local}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_TOKEN: ${EMAIL_WEBHOOK_TOKEN:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      AUTHORIZATION_LEASE_SIGNING_KEY_ID: ${AUTHORIZATION_LEASE_SIGNING_KEY_ID:-}
      AUTHORIZATION_LEASE_SIGNING_PRIVATE_KEY: ${AUTHORIZATION_LEASE_SIGNING_PRIVATE_KEY:-}
      AUTHORIZATION_LEASE_TTL_SECONDS: ${AUTHORIZATION_LEASE_TTL_SECONDS:-900}
      VALIDATION_QUEUE_MODE: redis
      OBJECT_STORAGE_MODE: s3
      ARTIFACT_UPLOAD_BASE_URL: ${ARTIFACT_UPLOAD_BASE_URL:-http://minio.localhost:9000/awesome-workflow-artifacts}
      S3_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://minio.localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${ARTIFACT_BUCKET:-awesome-workflow-artifacts}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      OIDC_ISSUER: ${OIDC_ISSUER:-http://logto.localhost:3001/oidc}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:4100/api/v1/auth/oidc/callback}
      OIDC_POST_LOGIN_REDIRECT: ${OIDC_POST_LOGIN_REDIRECT:-http://localhost:4300/}
      OIDC_ENABLED_PROVIDERS: ${OIDC_ENABLED_PROVIDERS:-}
      WORKLOAD_OIDC_POLICIES: ${WORKLOAD_OIDC_POLICIES:-[]}
    ports:
      - '${API_PORT:-4100}:4100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      WORKER_API_BASE_URL: http://api:4100
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      RELEASE_SIGNING_PUBLIC_KEYS: ${RELEASE_SIGNING_PUBLIC_KEYS}
      ARTIFACT_ALLOWED_ORIGINS: ${ARTIFACT_ALLOWED_ORIGINS:-http://minio:9000}
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-268435456}
      ARTIFACT_MAX_FILES: ${ARTIFACT_MAX_FILES:-10000}
      ARTIFACT_MAX_EXPANDED_BYTES: ${ARTIFACT_MAX_EXPANDED_BYTES:-1073741824}
      SBOM_MAX_BYTES: ${SBOM_MAX_BYTES:-16777216}

  web-shell:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web-shell
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4100/api/v1}
        VITE_CONTROL_PLANE_MANIFEST_URL: ${VITE_CONTROL_PLANE_MANIFEST_URL:-http://localhost:4302/mf-manifest.json}
        VITE_DEMO_IFRAME_URL: ${VITE_DEMO_IFRAME_URL:-}
        VITE_TRUSTED_FEDERATION_ORIGINS: ${VITE_TRUSTED_FEDERATION_ORIGINS:-http://localhost:4302}
        VITE_WORKSPACE_ID: ${VITE_WORKSPACE_ID:-}
    depends_on:
      api:
        condition: service_healthy
    environment:
      AW_CSP_SCRIPT_ORIGINS: http://localhost:4302
      AW_CSP_CONNECT_ORIGINS: http://localhost:4100 http://localhost:4302
      AW_CSP_FRAME_ORIGINS: http://127.0.0.1:4301
    ports:
      - '${WEB_SHELL_PORT:-4300}:8080'

  control-plane:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: control-plane
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4100/api/v1}
    depends_on:
      api:
        condition: service_healthy
    environment:
      AW_CSP_SCRIPT_ORIGINS: ''
      AW_CSP_CONNECT_ORIGINS: http://localhost:4100
      AW_CSP_FRAME_ORIGINS: "'none'"
    ports:
      - '${CONTROL_PLANE_PORT:-4302}:8080'

networks:
  aw-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
