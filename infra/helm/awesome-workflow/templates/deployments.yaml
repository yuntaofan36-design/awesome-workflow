{{- $root := . -}}
{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "awesome-workflow.fullname" $root }}-{{ $name }}
  labels:
    {{- include "awesome-workflow.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "awesome-workflow.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "awesome-workflow.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/config-map.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ include "awesome-workflow.serviceAccountName" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $component.image.repository }}:{{ $component.image.tag }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          {{- with $component.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- else if eq $component.runtime "static" }}
          command: ["nginx"]
          {{- end }}
          {{- with $component.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- else if eq $component.runtime "static" }}
          args: ["-g", "daemon off;"]
          {{- end }}
          {{- if or (eq $component.runtime "api") (eq $component.runtime "worker") }}
          envFrom:
            - configMapRef:
                name: {{ include "awesome-workflow.fullname" $root }}-{{ $component.runtime }}
          {{- end }}
          {{- if eq $component.runtime "api" }}
          env:
            {{- range $key := list "DATABASE_URL" "REDIS_URL" "SESSION_SECRET" "OTP_PEPPER" "WORKER_CALLBACK_TOKEN" "AUTHORIZATION_LEASE_SIGNING_PRIVATE_KEY" "S3_ACCESS_KEY_ID" "S3_SECRET_ACCESS_KEY" "OIDC_CLIENT_ID" "OIDC_CLIENT_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "AUTH_PASSWORD_ADMIN_EMAIL" "AUTH_PASSWORD_ADMIN_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- if eq $root.Values.config.api.emailDelivery "smtp" }}
            {{- range $key := list "SMTP_USER" "SMTP_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if eq $root.Values.config.api.emailDelivery "webhook" }}
            - name: EMAIL_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: EMAIL_WEBHOOK_TOKEN
            {{- end }}
          {{- else if eq $component.runtime "worker" }}
          env:
            {{- range $key := list "REDIS_URL" "WORKER_CALLBACK_TOKEN" "RELEASE_SIGNING_PUBLIC_KEYS" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: {{ $key }}
            {{- end }}
          {{- end }}
          {{- if $component.port }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          {{- end }}
          {{- if $component.healthPath }}
          readinessProbe:
            httpGet: { path: {{ $component.healthPath }}, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $component.healthPath }}, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component.runtime "static" }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $component.runtime "static" }}
        - name: nginx-config
          configMap:
            name: {{ include "awesome-workflow.fullname" $root }}-{{ $name }}-nginx
        {{- end }}
{{- end }}
