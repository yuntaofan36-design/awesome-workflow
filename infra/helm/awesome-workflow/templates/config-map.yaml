apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "awesome-workflow.fullname" . }}-api
  labels:
    {{- include "awesome-workflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  NODE_ENV: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "4100"
  API_PUBLIC_URL: {{ .Values.config.api.publicUrl | quote }}
  WEB_PUBLIC_URL: {{ .Values.config.api.webPublicUrl | quote }}
  API_ORIGINS: {{ .Values.config.api.origins | quote }}
  REPOSITORY_MODE: {{ .Values.config.api.repositoryMode | quote }}
  AUTH_MODE: {{ .Values.config.api.authMode | quote }}
  AUTH_DEV_EXPOSE_OTP: {{ ternary "true" "false" .Values.config.api.authDevExposeOtp | quote }}
  EMAIL_DELIVERY: {{ .Values.config.api.emailDelivery | quote }}
  SMTP_HOST: {{ .Values.config.api.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.api.smtpPort | quote }}
  SMTP_SECURE: {{ ternary "true" "false" .Values.config.api.smtpSecure | quote }}
  SMTP_REQUIRE_TLS: {{ ternary "true" "false" .Values.config.api.smtpRequireTls | quote }}
  SMTP_FROM: {{ .Values.config.api.smtpFrom | quote }}
  EMAIL_WEBHOOK_URL: {{ .Values.config.api.emailWebhookUrl | quote }}
  BOOTSTRAP_ADMIN_EMAILS: {{ .Values.config.api.bootstrapAdminEmails | quote }}
  AUTHORIZATION_LEASE_SIGNING_KEY_ID: {{ .Values.config.api.authorizationLeaseSigningKeyId | quote }}
  AUTHORIZATION_LEASE_TTL_SECONDS: {{ .Values.config.api.authorizationLeaseTtlSeconds | quote }}
  VALIDATION_QUEUE_MODE: {{ .Values.config.api.validationQueueMode | quote }}
  OBJECT_STORAGE_MODE: {{ .Values.config.api.objectStorageMode | quote }}
  ARTIFACT_UPLOAD_BASE_URL: {{ .Values.config.api.artifactUploadBaseUrl | quote }}
  S3_ENDPOINT: {{ .Values.config.api.s3Endpoint | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.config.api.s3PublicEndpoint | quote }}
  S3_REGION: {{ .Values.config.api.s3Region | quote }}
  S3_BUCKET: {{ .Values.config.api.s3Bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ ternary "true" "false" .Values.config.api.s3ForcePathStyle | quote }}
  OIDC_ISSUER: {{ .Values.config.api.oidcIssuer | quote }}
  OIDC_REDIRECT_URI: {{ .Values.config.api.oidcRedirectUri | quote }}
  OIDC_POST_LOGIN_REDIRECT: {{ .Values.config.api.oidcPostLoginRedirect | quote }}
  OIDC_ENABLED_PROVIDERS: {{ .Values.config.api.oidcEnabledProviders | quote }}
  WORKLOAD_OIDC_POLICIES: {{ .Values.config.api.workloadOidcPolicies | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otlpEndpoint | quote }}

{{ $root := . }}
{{ range $name, $component := .Values.components }}
{{ if eq $component.runtime "static" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "awesome-workflow.fullname" $root }}-{{ $name }}-nginx
  labels:
    {{- include "awesome-workflow.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /.well-known/awesome-workflow/federation-policy {
        default_type text/plain;
        return 200 {{ $component.csp.scriptOrigins | quote }};
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
      }

      location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' {{ $component.csp.scriptOrigins }}; style-src 'self' 'unsafe-inline' {{ $component.csp.scriptOrigins }}; img-src 'self' data: blob: {{ $component.csp.scriptOrigins }}; font-src 'self' data:; connect-src 'self' {{ $component.csp.scriptOrigins }} {{ $component.csp.connectOrigins }}; frame-src {{ $component.csp.frameOrigins }}; form-action 'self'; frame-ancestors 'self'" always;
      }

      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' {{ $component.csp.scriptOrigins }}; style-src 'self' 'unsafe-inline' {{ $component.csp.scriptOrigins }}; img-src 'self' data: blob: {{ $component.csp.scriptOrigins }}; font-src 'self' data:; connect-src 'self' {{ $component.csp.scriptOrigins }} {{ $component.csp.connectOrigins }}; frame-src {{ $component.csp.frameOrigins }}; form-action 'self'; frame-ancestors 'self'" always;
      }
    }
{{ end }}
{{ end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "awesome-workflow.fullname" . }}-worker
  labels:
    {{- include "awesome-workflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
data:
  NODE_ENV: "production"
  WORKER_API_BASE_URL: {{ default (printf "http://%s-api" (include "awesome-workflow.fullname" .)) .Values.config.worker.apiBaseUrl | quote }}
  ARTIFACT_ALLOWED_ORIGINS: {{ .Values.config.worker.artifactAllowedOrigins | quote }}
  ARTIFACT_MAX_BYTES: {{ .Values.config.worker.artifactMaxBytes | quote }}
  ARTIFACT_MAX_FILES: {{ .Values.config.worker.artifactMaxFiles | quote }}
  ARTIFACT_MAX_EXPANDED_BYTES: {{ .Values.config.worker.artifactMaxExpandedBytes | quote }}
  SBOM_MAX_BYTES: {{ .Values.config.worker.sbomMaxBytes | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otlpEndpoint | quote }}
