apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-logto
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: logto, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: oidc, port: {{ .Values.service.oidcPort }}, targetPort: oidc }
    - { name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin }

