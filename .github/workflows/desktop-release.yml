name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable release version
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      # Both targets merge into one updater JSON asset; serialize publication so
      # concurrent jobs cannot race while replacing that shared release asset.
      max-parallel: 1
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Set immutable desktop version
        shell: bash
        env:
          AW_DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const fs=require("node:fs"); const file="apps/desktop/src-tauri/tauri.conf.json"; const config=JSON.parse(fs.readFileSync(file,"utf8")); if(!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.AW_DESKTOP_VERSION)) throw new Error("version must be SemVer"); config.version=process.env.AW_DESKTOP_VERSION; fs.writeFileSync(file, `${JSON.stringify(config,null,2)}\n`);'
      - name: Configure signed updater trust
        env:
          AW_DESKTOP_UPDATER_ENDPOINT: ${{ vars.AW_DESKTOP_UPDATER_ENDPOINT }}
          AW_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.AW_DESKTOP_UPDATER_PUBLIC_KEY }}
        run: node apps/desktop/scripts/write-updater-config.mjs
      - name: Import Windows code-signing identity
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD is required' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'awesome-workflow-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $certificatePath -Force
          if (-not $certificate.Thumbprint) { throw 'The Windows signing certificate has no thumbprint' }
          $configPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -Force NoteProperty windows ([pscustomobject]@{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          })
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8
      - name: Build target sidecars
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.target }}" \
            -p awesome-workflow-agent \
            -p awesome-workflow-runner \
            -p awesome-workflow-elevated-helper
          node apps/desktop/scripts/stage-sidecars.mjs release "${{ matrix.target }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: v${{ inputs.version }}
          releaseName: Awesome Workflow ${{ inputs.version }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/${{ matrix.target }}/release/bundle/**/*
